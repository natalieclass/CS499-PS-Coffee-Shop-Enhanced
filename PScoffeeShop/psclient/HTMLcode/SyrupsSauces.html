<!DOCTYPE html>
<html lang='en'>
<head>
	<meta charset="utf-8">
	<title>P.S. Coffee Shop — Syrups &amp; Sauces</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<script src='/psclient/js/cart.js' defer></script>
	<script src='/psclient/js/productQuery.js' defer></script>
	<script src='/psclient/js/SyrupsSauces.js' defer></script>
	<!-- <link rel="stylesheet" type="text/css" href="/psclient/css/Subscriptions.css"> -->
	<script src='/psclient/js/LogOut.js' defer></script>
</head>

<body style="background-color:white">
	<img src="/psclient/images/mainImages/LOGOcropped2Circle.png" alt="Logo" width="110" height="120" align="left"/>

	<h1 style="color:hotpink">Presumptuous Sips</h1>
	<h2 style="color:pink">P.S. Member Dashboard</h2>

	<table id="psSchedule" border="2" width="100%" bgcolor="hotpink" height="8%">
		<tr>
			<th width="15%"><font color="white" size="5"><a href="/psclient/HTMLcode/PSDashboard.html"><I>DASHBOARD</I></a></font></th>
			<th width="15%"><font color="white" size="5"><a href="/psclient/HTMLcode/SyrupsSauces.html"><I>SHOP</I></a></font></th>
			<th width="15%"><font color="white" size="5"><a href="/psclient/HTMLcode/Member.html"><I>MEMBER</I></a></font></th>
			<th><button onclick="LogOut()" style="color:hotpink"><I>LOG OUT</I></button></th>
		</tr>
	</table>

	<h1 style="color:hotpink">Shopping Cart: Syrups N Sauces</h1>
	<div id="productControls" align="center">
		<label>Search: <input type="text" id="searchBox" placeholder="e.g. vanilla"></label>
		&nbsp;&nbsp;
		<label>Sort by:
			<select id="sortSelect">
				<option value="name">Name (A–Z)</option>
				<option value="price-asc">Price: low to high</option>
				<option value="price-desc">Price: high to low</option>
			</select>
		</label>
	</div>
	<center><h2 style="color:pink">DaVinci Gourmet Syrups</h2></center>
	<table id="syrupsTable">
		<tr id="syrupsRow" align="center"></tr>
	</table>

	<hr class="dashed">

	<center><h3 style="color:pink">DaVinci Gourmet Sauces</h3></center>
	<table id="saucesTable">
		<tr id="saucesRow" align="center"></tr>
	</table>

	<hr class="dashed">

	<div style="color: gray" id="TotalCalc">
		<fieldset id="memberInfoFS" disabled>
			<h3 id="subtotal">Subtotal &nbsp;$<span style="color:hotpink" id="subt"></span></h3>
			<h3 id="taxrate">Tax(7%) &nbsp;$<span style="color:hotpink" id="taxr"></span></h3>
			<h3 id="shipping">Shipping &nbsp;$<span style="color:hotpink" id="shipr"></span></h3>
			<h3 id="grandTotal">Grand Total &nbsp;$<span style="color:hotpink" id="grandt"></span></h3>
		</fieldset>
	</div>

	<hr class="dashed">

	<div align="center">
		<br><button style="background-color:green; color:white" id="checkout" onclick="Checkout()">Checkout</button>
	</div>
</body>
</html>
